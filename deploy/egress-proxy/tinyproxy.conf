# Forward proxy that is the scan workers' only route off their isolated network.
# It tunnels HTTPS to GitHub and nothing else.
Port 8888
Listen 0.0.0.0
Timeout 30
MaxClients 64
LogLevel Info
DisableViaHeader Yes
PidFile "/tmp/tinyproxy.pid"

# Only private networks (and the proxy's own loopback) may use the proxy.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

ConnectPort 443

# Deny every host that is not matched below. Anchored, so github.com.example.com is denied.
Filter "/etc/tinyproxy/allowed-hosts"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off

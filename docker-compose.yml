# Local development stack. `pnpm dev:server` starts only PostgreSQL and runs
# the API from source; `docker compose up` runs everything in containers.
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: dome
      POSTGRES_PASSWORD: dome
      POSTGRES_DB: dome
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dome"]
      interval: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: postgres://dome:dome@postgres:5432/dome
      PORT: "8080"
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Scan workers are hostile territory: no credentials, read-only root,
  # no privileges, bounded CPU, memory and process count, scratch space in
  # tmpfs. Restrict egress to GitHub at the network layer in production
  # (see docs/deployment.md).
  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://dome:dome@postgres:5432/dome
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    build:
      context: .
      target: indexer
    environment:
      DATABASE_URL: postgres://dome:dome@postgres:5432/dome
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-}
      REGISTRY_CONTRACT_ID: ${REGISTRY_CONTRACT_ID:-}
      STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE:-}
      INDEXER_START_LEDGER: ${INDEXER_START_LEDGER:-}
    profiles: [registry]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

# Builds the action bundle for a release tag (vX.Y.Z) and publishes it on a
# release commit tagged action-vX.Y.Z. Workflows pin that commit's SHA.
name: release-action
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build && pnpm test
      - run: pnpm --filter @dome-security/action bundle
      - name: Commit the bundle on a release commit and tag it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add --force packages/action/dist/index.js
          git commit -m "chore(release): action bundle for ${TAG}"
          git tag "action-${TAG}"
          git push origin "action-${TAG}"
          echo "Pin: dome-security/dome-backend/packages/action@$(git rev-parse HEAD) # action-${TAG}" >> "$GITHUB_STEP_SUMMARY"

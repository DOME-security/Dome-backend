# Variant that also uploads results to GitHub code scanning.
# security-events: write is only granted on pushes and same-repository PRs;
# fork PRs still get the check, job summary and annotations.
name: dome
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dome-security/dome-backend/packages/action@REPLACE_WITH_RELEASE_SHA
        with:
          mode: enforce
          sarif: true

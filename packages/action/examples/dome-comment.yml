# .github/workflows/dome-comment.yml: comment on pull requests from forks.
#
# Fork pull requests run with a read-only token, so the scan workflow cannot
# comment. This workflow runs afterwards from the default branch (its own
# definition, not the PR's), never checks out the PR, and re-scans the PR head
# as git objects only. It does not trust anything the PR run produced, so a PR
# that edits dome.yml cannot fake a clean comment.
name: dome-comment
on:
  workflow_run:
    workflows: [dome]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Find the pull request for this run
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          number=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq "map(select(.head.sha == \"$HEAD_SHA\")) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The base repository's default branch. Nothing from the PR is checked out.
      - if: steps.pr.outputs.number != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.pr.outputs.number != ''
        uses: dome-security/dome-backend/packages/action@REPLACE_WITH_RELEASE_SHA
        with:
          mode: report
          comment: true
          pull-request: ${{ steps.pr.outputs.number }}
          expected-head-sha: ${{ github.event.workflow_run.head_sha }}
